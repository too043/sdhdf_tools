[tool.poetry]
name = "pyINSPECTA"
version = "0.1.0"
description = "A collection of tools for interrogating Spectral-Domain Hierarchical Data Format (SDHDF) files"
authors = ["Lawrence Toomey, George Hobbs, Alec Thomson"]
readme = "README.md"
packages = [{include = "pyINSPECTA"}]

[tool.poetry.dependencies]
python = "^3.8"
numpy = "^1.21"
astropy = "^5"
h5py = "^3.7"
pandas = "^1.4"
xarray = "^2022"
matplotlib = "^3.5"
tables = "^3.7"
tabulate = "*"
dask = "*"
distributed = "*"

[tool.poetry.dev-dependencies]
black = "^22"
isort = "^5.10"
sphinx = "^4.2"
sphinx_mdinclude = "^0.5"
sphinx_rtd_theme = "^1.1"
nbconvert = "^7.2"
sphinx-autoapi = "^2"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff.lint]
extend-select = [
    "B",   # flake8-bugbear
    "I",   # isort
    "ARG", # flake8-unused-arguments
    "C4",  # flake8-comprehensions
    "EM",  # flake8-errmsg
    "ICN", # flake8-import-conventions
    "G",   # flake8-logging-format
    "PGH", # pygrep-hooks
    "PIE", # flake8-pie
    "PL",  # pylint
    "PT",  # flake8-pytest-style
    "PTH", # flake8-use-pathlib
    "RET", # flake8-return
    "RUF", # Ruff-specific
    "SIM", # flake8-simplify
    "T20", # flake8-print
    "UP",  # pyupgrade
    "YTT", # flake8-2020
    "EXE", # flake8-executable
    "NPY", # NumPy specific rules
    "PD",  # pandas-vet,
    "RET", # flake8-return
]
ignore = [
    "PLR09",   # Too many <...>
    "PLR2004", # Magic value used in comparison
    "ISC001",  # Conflicts with formatter
]
isort.required-imports = ["from __future__ import annotations"]
# Uncomment if using a _compat.typing backport
# typing-modules = ["spinifex._compat.typing"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20", "E402"]
"docs/examples/*" = ["T20", "E402", "T201"]
"docs/examples/*.ipynb" = ["T20", "E402", "T201"]
"*.ipynb" = ["T20", "E402", "T201"]
